schema_version = 1
[project]
name = "nfcraft"
master = "master.svg"
output = "icons"
casebook = "casebook"
[brief]
app_intent = "A pocket NFC workshop for reusable physical link cards"
user_job = "Keep destinations handy and give each reusable card the right link"
essence = "keep"
personality = ["tactile", "precise", "quietly magical"]
[design]
palette = ["#214b40", "#f7a24a", "#fff4de"]
cliches = ["generic pumpkin emoji", "NFC radio arcs", "letter tile", "tiny seasonal props"]
signature_device = "A jack-o-lantern card sleeve whose emerging cream card replaces the pumpkin stem"
device_family = "negative-space"
device_detail = "Broad chiseled eyes and a bat-wing thumb cut make the reusable pocket itself the lantern"
concept_lens = "object-action"
[build]
targets = ["web", "android"]
theme_color = "#214b40"
background_color = "#214b40"
maskable_scale = 0.8
monochrome_svg = "monochrome.svg"
electron_radius = 0
tray_ts = false
tray_svg = ""
tray_template_mode = "alpha"
color_scheme = "light"
optimize_png = true
[neighbours]
avoid = ["@collision"]
family = []
portfolio = []
[review]
status = "pending"
source_sha256 = ""
contract_sha256 = ""
scores = {}
notes = ""
