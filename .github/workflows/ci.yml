name: nfcraft hardware-free checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Official major refs checked in the handoff. Pin reviewed immutable SHAs
      # before depending on this workflow for a protected release pipeline.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/verify.py --require-node

  # The two encoders must keep agreeing, and the writer must keep riding out a
  # link that misbehaves. Both run on a desktop JVM, so neither needs a phone.
  android-encoder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash android/tools/parity.sh
# No NFC device access, cloud credentials, remote deploy or release publication.
